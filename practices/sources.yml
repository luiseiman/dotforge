# Repos curados para /forge scout
# Cada entry es un repo público con configuración .claude/ interesante
# /forge scout los revisa y reporta patterns útiles

sources:
  - name: anthropics/claude-code
    url: https://github.com/anthropics/claude-code
    focus: [hooks, settings, agents, skills]
    notes: "Referencia oficial — patterns canónicos"

  - name: anthropics/courses
    url: https://github.com/anthropics/courses
