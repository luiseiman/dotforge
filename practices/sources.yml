    notes: "Cursos oficiales — patterns de prompting"

  - name: anthropics/anthropic-cookbook
    url: https://github.com/anthropics/anthropic-cookbook
    focus: [rules, commands]
    notes: "Cookbook oficial — patterns de uso"

  # Community — repos con configuraciones .claude/ interesantes
  - name: ChrisWiles/claude-code-showcase
    url: https://github.com/ChrisWiles/claude-code-showcase
    focus: [hooks, settings, agents, skills, rules]
    notes: "Ejemplo completo de configuración — hooks, skills, agents, commands, GH Actions"

  - name: affaan-m/ECC
    url: https://github.com/affaan-m/ECC
    focus: [hooks, ci-validators, install-ledger, release-gate, context-budget]
    notes: "Renamed from everything-claude-code. Scouted 2026-11-04 (v2.2.3): catalog model (314 skills ≈26K tokens/session) and GateGuard are anti-patterns for dotforge; steal distribution/CI engineering only — SHA ledger, release gate, scripts/ci validators, config-protection hook, placebo evals. 7 practices captured 2026-11-04."

  - name: hesreallyhim/awesome-claude-code
    url: https://github.com/hesreallyhim/awesome-claude-code
    focus: [skills, hooks, commands, agents]
    notes: "Curated list — índice de recursos y herramientas"

  - name: shanraisshan/claude-code-best-practice
    url: https://github.com/shanraisshan/claude-code-best-practice
    focus: [skills, hooks, commands]
    notes: "Best practices — técnica de !command en SKILL.md para output dinámico"

  - name: Piebald-AI/claude-code-system-prompts
    url: https://github.com/Piebald-AI/claude-code-system-prompts
    focus: [system-prompt, tools, subagents, changelog]
    notes: "Extracción por versión del system prompt, tool descriptions y subagent prompts (1101 prompts, CHANGELOG con delta de tokens). Fuente de /forge watch para prompting-patterns.md desde v4.9.0. Scouted 2026-11-04."

  - name: karanb192/claude-code-hooks
    url: https://github.com/karanb192/claude-code-hooks
    focus: [hooks, deny-patterns, config-guard, protect-tests, subagent-cap]
    notes: "Marketplace de 22 plugins de hooks con salida JSON permissionDecision por niveles. Mejor catálogo de patrones deny (secretos vía Bash, gh destructivo, config-guard). Fail-open (catch → '{}') — no copiar el bootstrap. Scouted 2026-11-04."

  - name: jarrodwatts/claude-hud
    url: https://github.com/jarrodwatts/claude-hud
    focus: [statusline, context, transcript-parsing]
    notes: "Statusline plugin. Referencia del cálculo de contexto por message.usage (src/transcript.ts) que corrigió pre-compact-warning.sh en v4.8.1. Scouted 2026-11-04."
